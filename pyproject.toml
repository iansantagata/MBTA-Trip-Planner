[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "mbta-wrapper"
description = "A wrapper around MBTA APIs that allows for some additional functionality"
authors = [
    {name = "Ian Santagata", email = "7070901+iansantagata@users.noreply.github.com"}
]
version = "0.0.1"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "click==8.5.0",
    "requests==2.34.2",
]

[project.scripts]
routes = "main:routes"